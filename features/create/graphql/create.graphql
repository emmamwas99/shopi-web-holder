fragment DraftFields on DraftContent {
  id
  currentStep
  status
  bulkStage
  type
  title
  caption
  hashtags
  categoryId
  mediaAssetIds
  visibilityMode
  contactPhone
  allowDownload
  hdEnabled
  contentDeclarations
  scheduledPublishAt
  version
  sourceImportId
  importProvider
  source
  tiktokEmbed {
    videoId
    shareUrl
    coverImageUrl
    authorUsername
    authorName
    title
    duration
  }
  coverThumbnailUrl
  price {
    amount
    currency
    negotiable
  }
  specs {
    key
    value
  }
  location {
    placeName
    formattedAddress
    placeId
    county
    subregion
  }
  createdAt
  updatedAt
}

fragment CategoryFields on Category {
  id
  name
  slug
  description
  icon
  parentId
  depth
  sortOrder
  contentCount
}

query Categories {
  categories {
    ...CategoryFields
  }
}

fragment MediaAssetFields on MediaAsset {
  id
  type
  status
  sortOrder
  thumbnailUrl
  displayWidth
  displayHeight
  r2Variants {
    variant
    url
    width
    height
    sizeBytes
  }
  muxMeta {
    playbackId
    duration
    thumbnailUrl
    animatedThumbnailUrl
    aspectRatio
  }
  errorMessage
}

mutation CreateDraft($input: CreateDraftInput) {
  createDraft(input: $input) {
    ...DraftFields
  }
}

mutation AutosaveDraft($id: String!, $input: AutosaveDraftInput!) {
  autosaveDraft(id: $id, input: $input) {
    ...DraftFields
  }
}

mutation AdvanceDraftStep($id: String!) {
  advanceDraftStep(id: $id) {
    ...DraftFields
  }
}

mutation AttachMediaAsset($draftId: String!, $mediaAssetId: String!, $sortOrder: Int) {
  attachMediaAsset(draftId: $draftId, mediaAssetId: $mediaAssetId, sortOrder: $sortOrder) {
    ...DraftFields
  }
}

mutation DetachMediaAsset($draftId: String!, $mediaAssetId: String!) {
  detachMediaAsset(draftId: $draftId, mediaAssetId: $mediaAssetId) {
    ...DraftFields
  }
}

mutation ReorderDraftMedia($draftId: String!, $orderedAssetIds: [String!]!) {
  reorderDraftMedia(draftId: $draftId, orderedAssetIds: $orderedAssetIds) {
    ...DraftFields
  }
}

mutation PublishDraft($id: String!) {
  publishDraft(id: $id) {
    id
    type
    title
  }
}

mutation DiscardDraft($id: String!) {
  discardDraft(id: $id)
}

mutation RequestVideoUpload($draftId: String) {
  requestVideoUpload(draftId: $draftId) {
    uploadUrl
    muxUploadId
    mediaAssetId
    uploadSessionId
  }
}

mutation RequestImageUpload($draftId: String, $mimeType: String) {
  requestImageUpload(draftId: $draftId, mimeType: $mimeType) {
    uploadUrl
    tempKey
    mediaAssetId
    uploadSessionId
  }
}

mutation NotifyImageUploaded($mediaAssetId: String!) {
  notifyImageUploaded(mediaAssetId: $mediaAssetId) {
    ...MediaAssetFields
  }
}

mutation NotifyVideoUploaded($mediaAssetId: String!) {
  notifyVideoUploaded(mediaAssetId: $mediaAssetId) {
    ...MediaAssetFields
  }
}

query GetMediaAsset($id: String!) {
  mediaAsset(id: $id) {
    ...MediaAssetFields
  }
}

mutation CreateDraftFromTiktokImport($downloadId: String!) {
  createDraftFromTiktokImport(downloadId: $downloadId) {
    ...DraftFields
  }
}

mutation CreateDraftFromTiktokEmbed($input: TiktokEmbedInput!) {
  createDraftFromTiktokEmbed(input: $input) {
    ...DraftFields
  }
}

query SuggestedPostLocation {
  suggestedPostLocation {
    placeName
    formattedAddress
    placeId
    county
    subregion
  }
}

# The seller's saved contact number, used to pre-fill the composer so it is
# only ever typed once. Its own query rather than a field on `me` because the
# number is owner-only — see User.contactPhone in the API.
query MyContactPhone {
  myContactPhone
}

query GetDraft($id: String!) {
  draft(id: $id) {
    ...DraftFields
  }
}

query MyDrafts($limit: Int, $afterId: String) {
  myDrafts(limit: $limit, afterId: $afterId) {
    ...DraftFields
  }
}

query MyPendingBulkUploadDrafts {
  myPendingBulkUploadDrafts {
    ...DraftFields
  }
}

mutation CompleteBulkImportDraft($id: String!, $mediaType: ContentType!) {
  completeBulkImportDraft(id: $id, mediaType: $mediaType) {
    id
    bulkStage
  }
}

mutation ExtractDraftDetails($id: String!) {
  extractDraftDetails(id: $id) {
    title
    description
    price
    currency
    specs {
      key
      value
    }
    level1
    categoryId
    usedTranscript
  }
}

mutation ExtractDraftDetailsFromFrames($id: String!, $frames: [String!]!) {
  extractDraftDetailsFromFrames(id: $id, frames: $frames) {
    title
    description
    price
    currency
    specs {
      key
      value
    }
    level1
    categoryId
    usedTranscript
  }
}
