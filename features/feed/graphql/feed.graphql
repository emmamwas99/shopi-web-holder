fragment MuxMetaFields on MuxVideoMeta {
  playbackId
  duration
  aspectRatio
  thumbnailUrl
  animatedThumbnailUrl
}

fragment R2VariantFields on R2ImageVariant {
  url
  variant
  width
  height
}

fragment MediaItemFields on MediaItem {
  mediaType
  url
  imageUrl
  thumbnailUrl
  sortOrder
  displayWidth
  displayHeight
  muxMeta {
    ...MuxMetaFields
  }
  r2Variants {
    ...R2VariantFields
  }
}

fragment ContentCardFields on Content {
  id
  slug
  type
  source
  isLive
  tiktokEmbed {
    videoId
    shareUrl
    coverImageUrl
    authorUsername
    authorName
    title
    duration
  }
  title
  caption
  hashtags
  creatorId
  allowDownload
  hdEnabled
  createdAt
  creator {
    id
    username
    isVerified
    isFollowedByMe
    followerCount
    profile {
      firstName
      lastName
      avatar
    }
  }
  media {
    ...MediaItemFields
  }
  price {
    amount
    currency
    negotiable
  }
  stats {
    views
    likes
    shares
    saves
    comments
  }
  location {
    county
    subregion
    placeName
    formattedAddress
  }
  ranking {
    rankScore
    trendingScore
  }
  boost {
    isBoosted
    tier
  }
  isLikedByMe
  isSavedByMe
  isMyContent
  recentSavers {
    id
    username
    isVerified
    profile {
      firstName
      lastName
      avatar
    }
  }
  latestComment {
    id
    text
    creatorId
    createdAt
    author {
      id
      username
      isVerified
      profile {
        firstName
        lastName
        avatar
      }
    }
  }
}

query ForYouFeed($limit: Int, $after: String, $latitude: Float, $longitude: Float, $seed: String) {
  forYouFeed(limit: $limit, after: $after, latitude: $latitude, longitude: $longitude, seed: $seed) {
    items {
      ...ContentCardFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

# Immersive full-screen video viewer. `seedId` pins the tapped video first.
#
# Selects ContentCardFields VERBATIM, and must keep doing so. Content is
# normalized on `id`, so this query writes the same cache entities the feed
# does — but `ranking` is an embedded object with no `merge: true` in the type
# policy, so a narrower selection here would silently wipe fields the feed had
# already cached. Reusing the fragment is what makes that impossible.
query VideoFeed(
  $limit: Int
  $after: String
  $seedId: String
  $latitude: Float
  $longitude: Float
) {
  videoFeed(
    limit: $limit
    after: $after
    seedId: $seedId
    latitude: $latitude
    longitude: $longitude
  ) {
    items {
      ...ContentCardFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query TrendingContent($county: String) {
  trendingContent(county: $county) {
    ...ContentCardFields
  }
}

query GetContent($id: String!) {
  content(id: $id) {
    ...ContentCardFields
  }
}

# Revealed on demand when a signed-in buyer taps Call. Deliberately NOT part of
# ContentCardFields: keeping it off the feed/PDP payload is what stops every
# seller's number being harvested from a page crawl. See the API resolver.
query SellerContactPhone($contentId: String!) {
  sellerContactPhone(contentId: $contentId)
}

query FollowingFeed($limit: Int, $after: String) {
  followingFeed(limit: $limit, after: $after) {
    items {
      ...ContentCardFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query LocalFeed(
  $latitude: Float
  $longitude: Float
  $radiusKm: Float
  $county: String
  $subregion: String
  $limit: Int
  $after: String
) {
  localFeed(
    latitude: $latitude
    longitude: $longitude
    radiusKm: $radiusKm
    county: $county
    subregion: $subregion
    limit: $limit
    after: $after
  ) {
    items {
      ...ContentCardFields
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
