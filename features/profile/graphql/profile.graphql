fragment ProfileUserFields on User {
  id
  username
  email
  isVerified
  tiktokOpenId
  # Drives which account rows Settings can offer: changing a password only
  # means something for an account that has one.
  authProviders {
    local
    google
    facebook
    apple
  }
  profile {
    firstName
    lastName
    avatar
    bio
    website
  }
  followerCount
  followingCount
  postCount
  totalViews
  totalLikes
  isFollowedByMe
}

fragment ProfilePostFields on Content {
  id
  slug
  type
  title
  caption
  createdAt
  price {
    amount
    currency
    negotiable
  }
  location {
    county
    subregion
    placeName
  }
  stats {
    views
    likes
    saves
    shares
    comments
  }
  media {
    mediaType
    thumbnailUrl
    url
    sortOrder
    muxMeta {
      playbackId
      thumbnailUrl
      aspectRatio
    }
    r2Variants {
      variant
      url
      width
      height
    }
  }
}

query GetMyProfile {
  me {
    ...ProfileUserFields
  }
}

query GetUserProfile($username: String!) {
  userProfile(username: $username) {
    ...ProfileUserFields
  }
}

# A seller's public grid renders the same tile as /explore and the Saved tab,
# so it reads with the same fragment they do. Beyond matching the tile, this
# keeps the shared Content entities in one shape: a narrower selection here
# used to overwrite the feed's cached media and silently invalidate its cache.
query GetUserPosts($userId: String!, $limit: Int, $afterId: String, $sort: DiscoverySort) {
  userPosts(userId: $userId, limit: $limit, afterId: $afterId, sort: $sort) {
    hasMore
    nextCursor
    posts {
      ...ContentCardFields
    }
  }
}

query GetMyPosts($limit: Int, $afterId: String) {
  myPosts(limit: $limit, afterId: $afterId) {
    hasMore
    nextCursor
    posts {
      ...ProfilePostFields
    }
  }
}

# Saved posts use ContentCardFields, not ProfilePostFields.
#
# The Saved tab renders the same tile as /explore, and that tile needs fields
# the profile fragment does not carry: isSavedByMe (so its save button starts
# pressed), isLive and boost (the context chip), and the media duration. Reusing
# the discover fragment keeps the tile and its data in step — extending
# ProfilePostFields instead would have loaded those fields into the two
# inventory queries that have no use for them.
query GetMySavedContent($limit: Int, $afterId: String) {
  mySavedContent(limit: $limit, afterId: $afterId) {
    hasMore
    nextCursor
    items {
      ...ContentCardFields
    }
  }
}

query GetMyAnalytics {
  myAnalytics {
    last30DaysViews
    last30DaysSaves
    last30DaysFollowers
    topPost {
      contentId
      views
      saves
    }
    viewsByDay {
      date
      views
    }
  }
}

query CheckUsernameAvailability($username: String!) {
  checkUsername(username: $username) {
    username
    available
  }
}

mutation UpdateMyProfile($input: UpdateProfileInput!) {
  updateProfile(input: $input) {
    ...ProfileUserFields
  }
}

mutation RecordProfileVisit($userId: String!) {
  recordProfileVisit(userId: $userId)
}

# ── Profile visitors ("who viewed your profile") ──────────────────────────────

fragment VisitorFields on User {
  id
  username
  profile {
    firstName
    lastName
    avatar
  }
  isFollowedByMe
  isFollowingMe
}

query MyProfileVisitorsPreview($limit: Int) {
  myProfileVisitorsPreview(limit: $limit) {
    totalCount
    recent {
      ...VisitorFields
    }
  }
}

query MyProfileVisitors($limit: Int, $after: String) {
  myProfileVisitors(limit: $limit, after: $after) {
    totalCount
    hasMore
    nextCursor
    visitors {
      ...VisitorFields
    }
  }
}

query MyFollowers($limit: Int, $after: String) {
  myFollowers(limit: $limit, after: $after) {
    totalCount
    hasMore
    nextCursor
    users {
      ...VisitorFields
    }
  }
}

# ── TikTok import ─────────────────────────────────────────────────────────────

query GetMyTiktokVideos($cursor: String) {
  myTiktokVideos(cursor: $cursor) {
    videos {
      id
      title
      coverImageUrl
      shareUrl
      duration
      createTime
      viewCount
      likeCount
    }
    nextCursor
    hasMore
  }
}

query GetMyTiktokImports {
  myTiktokImports {
    id
    url
    status
    title
    thumbnailUrl
    muxPlaybackId
    hlsUrl
    errorMessage
    createdAt
  }
}

query GetMyTiktokImportsPaged($limit: Int, $after: String) {
  myTiktokImportsPaged(limit: $limit, after: $after) {
    hasMore
    nextCursor
    items {
      id
      url
      status
      title
      thumbnailUrl
      muxPlaybackId
      hlsUrl
      errorMessage
      createdAt
    }
  }
}

mutation BatchImportTiktokVideos($shareUrls: [String!]!) {
  batchImportTiktokVideos(shareUrls: $shareUrls) {
    batchId
    queued
    skipped
    downloads {
      id
      url
      status
      title
      thumbnailUrl
      errorMessage
    }
  }
}

query GetTiktokConnectStatus {
  me {
    id
    authProviders {
      tiktok
    }
  }
}

mutation GetTiktokConnectUrl($returnUrl: String) {
  tiktokConnectUrl(returnUrl: $returnUrl)
}

# ── Account security ─────────────────────────────────────────────────────────

# Returns a fresh token pair: changing the password revokes every other
# session, including the one that made this call, so the client must swap in
# the new tokens or it signs itself out.
mutation ChangePassword($input: ChangePasswordInput!) {
  changePassword(input: $input) {
    accessToken
    refreshToken
    user {
      id
    }
  }
}

# `password` is required for accounts that have one and ignored for social-only
# sign-ins, which have nothing to verify against.
mutation DeleteMyAccount($password: String) {
  deleteMyAccount(password: $password)
}

# ── Rate us ──────────────────────────────────────────────────────────────────

fragment AppRatingFields on AppRating {
  id
  stars
  comment
  updatedAt
}

query MyAppRating {
  myAppRating {
    ...AppRatingFields
  }
}

query AppRatingSummary {
  appRatingSummary {
    average
    total
    distribution
  }
}

mutation SubmitAppRating($input: SubmitAppRatingInput!) {
  submitAppRating(input: $input) {
    ...AppRatingFields
  }
}
